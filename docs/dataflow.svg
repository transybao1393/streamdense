<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="ttl dsc">
<title id="ttl">streamdense system overview</title>
<desc id="dsc">Clients (coding agents such as Claude Code, the SwiftUI app) send requests to the streamdense gateway (Anthropic Messages API on 127.0.0.1:8898, Rust tokenizer, KV prefix reuse, snapshots) or to qwen serve. The engine runs Qwen3.8-27B 4-bit on the Metal GPU, in one of two modes: full model (all weights in RAM, MTP speculative decoding, peak 15.86 GB in live gateway use) or 12 GB mode ([forheader] mode = "12gb": compact FFN chosen per prompt, peak 11.76 GB). Weights come from the SSD; the model process runs under sd-watchdog with a hard cap of 16 GB. Tokens stream back to the client.</desc>
<style>
svg{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.card{fill:#f6f8fa;stroke:#d0d7de}
.box{fill:#ffffff;stroke:#8c959f;stroke-width:1.3}
.frame{fill:none;stroke:#9a6700;stroke-width:1.6;stroke-dasharray:8 6}
.t{fill:#1f2328;font-size:13px}.h{fill:#1f2328;font-size:16px;font-weight:700}
.ti{fill:#1f2328;font-size:20px;font-weight:700}.m{fill:#424a53;font-size:12px}
.wd{fill:#9a6700;font-size:13px;font-weight:700}.kg{fill:#1a7f37;font-size:13px;font-weight:700}
.c{fill:#24292f;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.ln{stroke:#8c959f;stroke-width:1.6;fill:none}
.ah{fill:#8c959f}
.cq{fill:#0969da}.ct{fill:#8250df}.cw{fill:#1a7f37}
.gpu{fill:none;stroke:#8250df;stroke-width:2;animation:gp 1.2s ease-in-out infinite}
.mode{fill:none;stroke:#1a7f37;stroke-width:1.5;stroke-dasharray:5 4}
@keyframes gp{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
@keyframes q1{0%{transform:translate(190px,150px);opacity:1}10%{transform:translate(240px,150px);opacity:1}11%,100%{transform:translate(240px,150px);opacity:0}}
@keyframes q2{0%,10%{transform:translate(460px,150px);opacity:0}11%{opacity:1}18%{transform:translate(500px,150px);opacity:1}19%,100%{transform:translate(500px,150px);opacity:0}}
@keyframes w1{0%,12%{transform:translate(830px,335px);opacity:0}13%{opacity:1}26%{transform:translate(780px,335px);opacity:1}27%,100%{transform:translate(780px,335px);opacity:0}}
@keyframes w2{from{transform:translate(640px,280px)}to{transform:translate(640px,232px)}}
@keyframes te{0%,30%{transform:translate(500px,200px);opacity:0}31%{opacity:1}37%{transform:translate(460px,200px);opacity:1}38%,100%{transform:translate(460px,200px);opacity:0}}
@keyframes tc{0%,38%{transform:translate(240px,300px);opacity:0}39%{opacity:1}47%{transform:translate(190px,300px);opacity:1}48%,100%{transform:translate(190px,300px);opacity:0}}
.a1{animation:q1 6s linear infinite}.a2{animation:q2 6s linear infinite}.a3{animation:w1 6s linear infinite}
.a4{animation:w2 1.2s linear infinite}.a5{animation:w2 1.2s linear -.6s infinite}
.a6{animation:te 6s linear infinite}.a7{animation:te 6s linear -4.8s infinite}.a8{animation:te 6s linear -3.6s infinite}
.a9{animation:tc 6s linear infinite}.a10{animation:tc 6s linear -4.8s infinite}.a11{animation:tc 6s linear -3.6s infinite}
@media (prefers-color-scheme:dark){
.card{fill:#161b22;stroke:#30363d}.box{fill:#0d1117;stroke:#6e7681}
.frame{stroke:#d29922}.wd{fill:#d29922}.kg{fill:#3fb950}
.t,.h,.ti{fill:#f0f6fc}.m{fill:#c9d1d9}.c{fill:#e6edf3}
.ln{stroke:#9198a1}.ah{fill:#9198a1}
.cq{fill:#4493f8}.ct{fill:#ab7df8}.cw{fill:#3fb950}.gpu{stroke:#ab7df8}.mode{stroke:#3fb950}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.mv{display:none}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="card" x="1" y="1" width="998" height="488" rx="14"/>
<text class="ti" x="24" y="38">streamdense: request → tokens</text>

<!-- clients -->
<rect class="box" x="20" y="100" width="170" height="240" rx="10"/>
<text class="h" x="34" y="126">Clients</text>
<text class="t" x="34" y="156">Coding agents</text>
<text class="t" x="34" y="180">Claude Code</text>
<text class="t" x="34" y="204">SwiftUI app</text>
<text class="m" x="34" y="222">(JSON lines → qwen serve)</text>
<text class="m" x="34" y="300">request →</text>
<text class="m" x="34" y="318">← streamed tokens</text>

<!-- watchdog frame -->
<rect class="frame" x="220" y="62" width="580" height="360" rx="12"/>
<text class="wd" x="234" y="86">sd-watchdog · hard cap 16 GB (streamdense.toml) · swap limit 7 GB · nice 10</text>

<!-- gateway -->
<rect class="box" x="240" y="100" width="220" height="240" rx="10"/>
<text class="h" x="254" y="126">streamdense gateway</text>
<text class="t" x="254" y="152">Anthropic Messages API</text>
<text class="m" x="254" y="170">127.0.0.1:8898 · max_ctx 8192</text>
<text class="t" x="254" y="196">Rust tokenizer + chat template</text>
<text class="t" x="254" y="220">KV prefix reuse</text>
<text class="t" x="254" y="244">snapshots (warm restarts)</text>
<text class="m" x="254" y="286">qwen serve: same engine,</text>
<text class="m" x="254" y="304">JSON lines for the app</text>

<!-- engine -->
<rect class="box" x="500" y="100" width="280" height="130" rx="10"/>
<rect class="gpu" x="500" y="100" width="280" height="130" rx="10"/>
<text class="h" x="514" y="126">Engine · Rust + Metal GPU</text>
<text class="t" x="514" y="150">Qwen3.8-27B, MLX 4-bit weights</text>
<text class="t" x="514" y="170">48 Gated DeltaNet + 16 attention layers</text>
<text class="t" x="514" y="190">MTP speculative decoding (depth auto)</text>
<text class="m" x="514" y="210">output identical to plain greedy</text>

<!-- RAM: two modes -->
<rect class="box" x="500" y="270" width="280" height="140" rx="10"/>
<text class="h" x="514" y="294">RAM (unified memory)</text>
<text class="t" x="514" y="316">Full model (default): all weights</text>
<text class="m" x="514" y="333">peak 15.86 GB in live use</text>
<rect class="mode" x="508" y="342" width="264" height="60" rx="7"/>
<text class="kg" x="516" y="360">12 GB mode (research, off by default)</text>
<text class="c" x="516" y="376">[forheader] mode = "12gb"</text>
<text class="m" x="516" y="394">compact FFN per prompt · peak 11.76 GB</text>

<!-- SSD -->
<rect class="box" x="830" y="270" width="150" height="140" rx="10"/>
<text class="h" x="844" y="294">SSD</text>
<text class="t" x="844" y="318">safetensors (mmap)</text>
<text class="m" x="844" y="338">downloaded with</text>
<text class="m" x="844" y="356">sd-fetch</text>
<text class="m" x="844" y="380">12 GB mode: full FFN</text>
<text class="m" x="844" y="398">streamed per prompt</text>

<!-- arrows -->
<path class="ln" d="M190,150 H238" marker-end="url(#a)"/>
<path class="ln" d="M460,150 H498" marker-end="url(#a)"/>
<path class="ln" d="M500,200 H462" marker-end="url(#a)"/>
<path class="ln" d="M240,300 H192" marker-end="url(#a)"/>
<path class="ln" d="M640,270 V232" marker-end="url(#a)"/>
<path class="ln" d="M830,335 H782" marker-end="url(#a)"/>

<!-- moving dots: request (blue), weights (green), tokens (purple) -->
<circle class="cq mv a1" r="6"/>
<circle class="cq mv a2" r="6"/>
<circle class="cw mv a3" r="5"/>
<circle class="cw mv a4" r="5"/>
<circle class="cw mv a5" r="5"/>
<circle class="ct mv a6" r="6"/>
<circle class="ct mv a7" r="6"/>
<circle class="ct mv a8" r="6"/>
<circle class="ct mv a9" r="6"/>
<circle class="ct mv a10" r="6"/>
<circle class="ct mv a11" r="6"/>

<!-- legend -->
<circle class="cq" cx="34" cy="456" r="6"/><text class="t" x="46" y="461">request</text>
<circle class="ct" cx="134" cy="456" r="6"/><text class="t" x="146" y="461">generated tokens (streamed)</text>
<circle class="cw" cx="354" cy="456" r="6"/><text class="t" x="366" y="461">weights: SSD → RAM page-in, RAM → GPU every decode pass</text>
</svg>
