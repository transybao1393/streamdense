# Standalone crate (NOT a member of the engine workspace): the empty [workspace] table below makes this directory its
# own workspace root, so `cargo` in engine/ (cargo fast, clippy --workspace, CI) never builds or tests it.
[package]
name = "qwen-dense"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde_json = "1.0.151"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
# Reused read-only from the engine workspace: safetensors header index, f16/bf16 conversion, footprint; Qwen BPE tokenizer.
streamdense-core = { path = "../crates/streamdense-core" }
streamdense-tokenizer = { path = "../crates/streamdense-tokenizer" }
libc = "0.2.189"

# The CPU references in the GPU tests do O(heads x ctx x 128) work per case; unoptimised they would dominate.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1

# Same style allowances as engine/Cargo.toml [workspace.lints.clippy] (index loops mirroring the kernels, one arg per
# buffer in launch helpers, explicit (n + d - 1) / d).
[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
excessive_precision = "allow"
