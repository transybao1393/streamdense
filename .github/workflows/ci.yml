# CI: build + clippy (-D warnings) + the fast test set. No secrets, no model downloads, no GPU tests.
# Tests that need models/ (gitignored) print "SKIP: needs models/..." and return; Metal/weights test targets are not run
# here (see README "Tests"). TODO: Swift app (app/) needs Xcode; not built here.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  engine:
    runs-on: macos-14
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11 (v1)
        with:
          toolchain: 1.97.1 # current stable, pinned so new clippy lints do not break CI unannounced
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            engine -> target
            engine/qwen-dense -> target
            engine/model_layer -> target
      - name: build
        run: cargo build --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: fast tests (no models/, no GPU)
        run: cargo fast -- --show-output
      # engine/qwen-dense and engine/model_layer are their own Cargo workspaces (see their Cargo.toml)
      - name: qwen-dense clippy + unit tests (no GPU, no models/)
        working-directory: engine/qwen-dense
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --lib --locked -- --show-output
      - name: model_layer clippy + unit tests (no GPU, no models/)
        working-directory: engine/model_layer
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked -- --show-output
